<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Institute - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

<nav>
    <a href="index.html">Home</a><span>|</span>
    <a href="about.html">About Us</a><span>|</span>
    <a href="courses.html">Courses</a><span>|</span>
    <a href="students.html">Students</a><span>|</span>
    <a href="registration.html">Registration</a><span>|</span>
    <a href="contact.html">Contact</a>
</nav>


        <div class="page-heading blue">
            <h1>Student Registration Form</h1>
        </div>

        <div class="content registration-content">
            <form id="registrationForm">
                <table class="form-table">
                    <tr>
                        <td>Full Name:</td>
                        <td>
                            <input id="fullName" type="text" placeholder="Enter your full name">
                        </td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td>
                            <input id="email" type="email" placeholder="Enter your email">
                        </td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td>
                            <input id="password" type="password" placeholder="Enter password (min 5 characters)">
                        </td>
                    </tr>
                    <tr>
                        <td>Contact Number:</td>
                        <td>
                            <input id="phone" type="tel" placeholder="Enter your contact number">
                        </td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td class="choice-row">
                            <label><input type="radio" name="gender" value="Male"> Male</label>
                            <label><input type="radio" name="gender" value="Female"> Female</label>
                            <label><input type="radio" name="gender" value="Other"> Other</label>
                        </td>
                    </tr>
                    <tr>
                        <td>Select Courses:</td>
                        <td class="choice-row">
                            <label><input type="checkbox" name="courses" value="HTML"> HTML</label>
                            <label><input type="checkbox" name="courses" value="CSS"> CSS</label>
                            <label><input type="checkbox" name="courses" value="JavaScript"> JavaScript</label>
                            <label><input type="checkbox" name="courses" value="Python"> Python</label>
                        </td>
                    </tr>
                    <tr>
                        <td>Address:</td>
                        <td>
                            <textarea id="address" placeholder="Enter your address here"></textarea>
                        </td>
                    </tr>
                </table>

                <div id="formError" class="error-text"></div>

                <div class="form-actions">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </div>


<div class="footer">
    © 2026 Future Institute. All Rights Reserved.
</div>

    </div>

    <div id="successOverlay" class="success-overlay">
        <div class="success-box">
            <div class="success-check">✓</div>
            <h2>Registration Successful</h2>
            <p>Your student profile has been created.</p>
            <p class="small-note">Opening your profile...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
