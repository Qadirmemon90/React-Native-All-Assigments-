        <div class="page-heading purple">
            <h1>Contact Us</h1>
        </div>

        <div class="content">
            <div class="contact-layout">
                <div class="contact-info">
                    <h3>Future Institute</h3>
                    <p><strong>Email:</strong><br>info@futureinstitute.com</p>
                    <p><strong>Phone:</strong><br>0300-1234567</p>
                    <p><strong>City:</strong><br>Karachi, Pakistan</p>
                    <p>
                        Contact us for admission, course details and general information.
                    </p>
                </div>

                <form id="contactForm" class="contact-form">
                    <label for="contactName">Your Name</label>
                    <input id="contactName" type="text" required>

                    <label for="contactEmail">Email</label>
                    <input id="contactEmail" type="email" required>

                    <label for="contactSubject">Subject</label>
                    <input id="contactSubject" type="text" required>

                    <label for="contactText">Message</label>
                    <textarea id="contactText" required></textarea>

                    <div class="form-actions">
                        <button type="submit">Send Message</button>
                    </div>

                    <p id="contactMessage" class="center status-active"></p>
                </form>
            </div>
        </div>
